# MoveIt Servo for a UR arm with an OnRobot gripper (ROS 2 Humble), in any cell.

use_gazebo: false

## Incoming commands
# "speed_units": velocities are in m/s and rad/s
# "unitless": commands are in the range [-1.0, 1.0] (for example from a gamepad)
command_in_type: "speed_units"

scale:
  linear: 0.4        # highest linear velocity [m/s]
  rotational: 0.8    # highest angular velocity [rad/s]
  joint: 0.5         # highest joint velocity [rad/s]

system_latency_compensation: 0.04

## Outgoing commands
publish_period: 0.004   # 250 Hz (1/publish_period)
low_latency_mode: false # publish at the nominal period

# Joint trajectories for the active controller of the arm
command_out_type: trajectory_msgs/JointTrajectory

publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

## Smoothing of the commands, against jitter and acceleration peaks
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# Planning Scene Monitor
is_primary_planning_scene_monitor: true
low_pass_filter_coeff: 10.0

## Kinematics and planning group
move_group_name: ur_manipulator
planning_frame: base_link
ee_frame_name: gripper_tcp
robot_link_command_frame: base_link

## Stopping
incoming_command_timeout: 0.15 # stop when no command arrives in 150 ms
num_outgoing_halt_msgs_to_publish: 4

## Kinematic singularities
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.08
leaving_singularity_threshold_multiplier: 2.0

## Topics
cartesian_command_in_topic: ~/delta_twist_cmds  # geometry_msgs/TwistStamped
joint_command_in_topic: ~/delta_joint_cmds       # control_msgs/JointJog
joint_topic: /merged_joint_states                # arm and gripper together
status_topic: ~/status                           # moveit_msgs/ServoStatus
command_out_topic: /scaled_joint_trajectory_controller/joint_trajectory

## Collision checking while moving
check_collisions: true
collision_check_rate: 10.0 # 10 Hz
self_collision_proximity_threshold: 0.015  # slow down closer than 15 mm to a self collision
scene_collision_proximity_threshold: 0.025 # slow down closer than 25 mm to the furniture
min_allowable_collision_distance: 0.005    # stop closer than 5 mm
collision_distance_safety_factor: 1000.0
