# Parameters of the broadcasters and of the UR status controllers.
environment_joint_state_broadcaster:
  ros__parameters:
    joints:
      - world_to_table
      - world_to_conveyor
      - world_to_table_2
      # LEGACY, commented out on 2026-11-24: the safety barriers are not part of the cell any more
      # (ur_workspace_description/urdf/environments/table_conveyor_cell.xacro).
      # - table_to_barrier_left
      # - table_to_barrier_right
      # - table_to_barrier_back
      # - table_to_barrier_front
      # - table_to_barrier_top

# Robot joint state broadcaster
joint_state_broadcaster:
  ros__parameters: {}

finger_width_controller:
  ros__parameters:
    joints:
      - $(var tf_prefix)finger_width
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 50.0
    action_monitor_rate: 10.0
    allow_partial_joints_goal: true
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.01
      finger_width:
        goal: 0.001
        trajectory: 0.001

speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "$(var tf_prefix)"

io_and_status_controller:
  ros__parameters:
    tf_prefix: "$(var tf_prefix)"

ur_configuration_controller:
  ros__parameters:
    tf_prefix: "$(var tf_prefix)"

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: $(var tf_prefix)tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: $(var tf_prefix)tool0
    topic_name: ft_data
